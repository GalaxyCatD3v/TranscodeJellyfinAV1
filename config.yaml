# Galaxy AV1 Migrator - Configuration File
# Safely converts Jellyfin media library over SSHFS to AV1 1080p using NVIDIA NVENC.

media_roots:
  - "V:\\srv\\storage\\Movies"
  - "V:\\media\\TVShows"

extensions:
  - ".mkv"
  - ".mp4"
  - ".m4v"
  - ".m2ts"
  - ".ts"
  - ".avi"
  - ".mov"

output:
  container: "mkv"
  video_codec: "av1_nvenc"
  preset: "p5"
  cq: 28
  width: 1920
  height: 1080
  prefer_cuda_scale: true
  cuda_interp_algo: "bicubic"     # Hardware CUDA scaling interpolation: "bicubic", "bilinear", or "lanczos"
  pixel_format: "p010le"
  gpu_device: 0                   # Dedicated NVIDIA GPU card device index (0 = primary dedicated GPU)
  cpu_video_codec: "auto"         # CPU AV1 encoder: "auto" (detects libsvtav1 or libaom-av1), "libsvtav1", "libaom-av1"
  cpu_preset: "6"                 # Preset/speed for CPU encoding (6-8)
  cpu_crf: 28


audio:
  languages:
    - "eng"
    - "en"
    - "english"
  mode: "copy"
  bitrate: "256k"
  exclude_commentary: true

subtitles:
  languages:
    - "eng"
    - "en"
    - "english"
  mode: "copy"

storage:
  minimum_free_space: "1TB"
  safety_margin: "10GB"
  poll_interval: 0.5
  local_staging_dir: "F:\\JellyfinTranscode"  # Local fast NVMe directory for zero-latency encoding
  enable_local_staging: true                 # Stage remote files locally to eliminate GPU starvation
  local_min_free_space: "20GB"

processing:
  sort: "largest_first"           # "largest_first" (biggest files first) or "smallest_first"
  delete_original: true
  validate_output: false
  keep_smaller: true
  pre_encode_check: true          # Pre-encode sample analysis to predict space savings & prevent wasted encoding
  sample_duration: 30.0           # Seconds of representative sample clip to test transcode
  min_savings_percent: 0.0        # Minimum % savings required to transcode (0.0 = must not bloat)
  enable_gpu_encoding: true       # Use NVIDIA NVENC GPU encoding
  enable_gpu1: true               # Use GPU 1 NVENC worker
  enable_gpu2: false              # Disable secondary GPU worker (single GPU card mode)
  gpu_workers: 1                  # Total concurrent GPU workers (1 for single GPU card)
  gpu_device_id: 0                # Dedicated NVIDIA GPU card index (dedicated card not CPU iGPU)
  enable_cpu_encoding: false      # Use concurrent CPU AV1 worker alongside GPU
  resume: false
  scan_cache_hours: 6.0           # Skip remote filesystem scan/probe if last scan was < 6 hours ago
  network_retries: 6
  network_retry_delay: 60.0
  duration_tolerance: 5.0

video_selection:
  prefer_native_1080p: false

ffmpeg:
  executable: "ffmpeg.exe"
  ffprobe: "ffprobe.exe"

ui:
  refresh_rate: 1.0

database:
  path: "F:\\JellyfinTranscode\\migration.db"

logging:
  directory: "logs"
  filename: "av1-migrator.log"
  max_bytes: 10485760 # 10 MB
  backup_count: 10
